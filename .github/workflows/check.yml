name: check

# Runs on macOS, Windows and Linux so the one-repo promise is tested, not assumed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Version files agree
        shell: bash
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          t="$(tr -d '[:space:]' < template/.kit-version)"
          test "$v" = "$t" || { echo "VERSION ($v) and template/.kit-version ($t) differ"; exit 1; }
          grep -q "^## $v " CHANGELOG.md || { echo "CHANGELOG.md has no entry for $v"; exit 1; }

      - name: Safety scan (secrets, private files, banned names, em dashes)
        run: node setup/scan-repo.mjs

      - name: Installer syntax and help
        run: |
          node --check setup/install.mjs
          node setup/install.mjs --help

      - name: Installer dry run (changes nothing)
        run: node setup/install.mjs --dry-run --skip-plugins --skip-sound --skip-packages

      - name: Script self-tests
        shell: bash
        run: |
          python studio/tools/budget.py --selftest
          python template/.claude/skills/account-audit/outliers.py --selftest
          python template/.claude/skills/humanizer/humanize_check.py --selftest
          python template/.claude/skills/hook-mining/mine_hooks.py --selftest
          python template/.claude/skills/brand-setup/prefill.py --selftest

      - name: New brand folder script works (copy, refuse existing, refuse inside the kit)
        shell: bash
        run: |
          node --check setup/new-brand.mjs
          B="$RUNNER_TEMP/test-reels"
          node setup/new-brand.mjs "$B" | grep -q "OK: made a new brand folder"
          diff -r template "$B"
          if node setup/new-brand.mjs "$B"; then echo "should refuse an existing folder"; exit 1; fi
          if node setup/new-brand.mjs ./inside-kit; then echo "should refuse a folder inside the kit"; exit 1; fi
          test ! -e inside-kit && test ! -e inside-kit-reels
          test -f .claude/skills/brand-setup/SKILL.md
          node setup/new-brand.mjs "$RUNNER_TEMP/acme" | grep -q "acme-reels"
          test -f "$RUNNER_TEMP/acme-reels/CLAUDE.md" && test ! -e "$RUNNER_TEMP/acme"

      - name: Commands reference lists every command and is current
        run: node setup/make-commands.mjs --check

      - name: Sticker host (image steps, unlimited poses, kit host finds missing poses)
        shell: bash
        run: |
          python -m pip install --quiet pillow numpy
          python template/.claude/skills/sticker-host/host.py selftest
          B="$RUNNER_TEMP/hosttest"
          node setup/new-brand.mjs "$B" | grep -q "hosttest-reels"
          B="$B-reels"
          python - "$B" <<'PY'
          import json, sys, os
          from PIL import Image
          b = sys.argv[1]; p = os.path.join(b, 'brand', 'brand.json'); d = json.load(open(p))
          d['name'] = 'Test'; d['host'] = {'enabled': True, 'type': 'stickers', 'poses_dir': 'brand/host/poses', 'notes': ''}
          json.dump(d, open(p, 'w'), indent=2)
          os.makedirs(os.path.join(b, 'brand', 'host', 'poses'))
          for n in ('idle', 'point', 'my-own-pose'):
              Image.new('RGBA', (896, 1120), (0, 0, 0, 0)).save(os.path.join(b, 'brand', 'host', 'poses', n + '.png'))
          PY
          node studio/tools/kit.mjs start "$B/reels/demo" --style print
          python - "$B/reels/demo/reel.json" <<'PY'
          import json, sys
          p = sys.argv[1]; d = json.load(open(p))
          d['presenter'] = {'type': 'stickers', 'dir': 'host', 'cues': [['go', 'my-own-pose', 1], ['look', 'magnifier', 1]]}
          json.dump(d, open(p, 'w'), indent=2)
          PY
          set +e; node studio/tools/kit.mjs host "$B/reels/demo" --check > "$RUNNER_TEMP/host.txt"; code=$?; set -e
          cat "$RUNNER_TEMP/host.txt"
          test "$code" = 2 && grep -q "MISSING: magnifier" "$RUNNER_TEMP/host.txt" && ! grep -q "MISSING: my-own-pose" "$RUNNER_TEMP/host.txt"
          if node studio/tools/kit.mjs start "$RUNNER_TEMP/loose/reels/r" --style print; then echo "kit start must refuse outside a brand folder"; exit 1; fi

      - name: Update script works (dry run, apply, brand data untouched)
        shell: bash
        run: |
          W="$RUNNER_TEMP/ws"; cp -R template "$W"
          echo "keep me" > "$W/reels/mine.txt"
          echo "local edit" >> "$W/CLAUDE.md"
          node setup/sync-template.mjs "$W" | grep -q "kit version"
          node setup/sync-template.mjs "$W" --apply
          cmp template/CLAUDE.md "$W/CLAUDE.md"
          test "$(cat "$W/reels/mine.txt")" = "keep me"
          test "$(tr -d '[:space:]' < "$W/.kit-version")" = "$(tr -d '[:space:]' < VERSION)"

      - name: Real install of the engine into a temporary home
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          export HOME="$RUNNER_TEMP/home"; export USERPROFILE="$HOME"; mkdir -p "$HOME"
          node setup/install.mjs --skip-packages --skip-plugins --skip-sound
          test -f "$HOME/.claude/skills/bagelunit-reels/KIT.md"
